# The README says `forge test` is 404 passed and that scripts/check-public.sh is "what CI runs".
# Until now there was no CI, so both were claims a reader had to take on trust. This is the CI.
#
# check-public.sh is the load-bearing one: this repo is public, and the check that nothing
# credential-shaped is tracked belongs on every push rather than on somebody remembering.
name: ci
on:
  push:
  pull_request:
# Nothing here writes back to the repo or uses the token, so it gets read and no more. Every action is pinned to a
# commit (its tag in the comment), not a tag that can be moved, and no checkout keeps the token in .git/config.
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # Pinned to the version the maintainers actually run. It was v1.3.0, whose `forge fmt` disagrees
          # with newer releases about blank lines, so `fmt --check` failed in CI on files that were clean
          # locally. A formatter check is only useful if both sides format the same way.
          version: v1.7.1
      - run: forge --version
      - run: forge fmt --check
      # CreditPoolV2 and every file that imports it (StockVault, the SeatVaults and their tests) compile in one via-IR
      # solc process (foundry.toml's compilation_restrictions), whose memory grows with each test contract in it. With
      # all of test/ in it, `forge build` peaked at 18 GiB, over the runner's 16 GB, and the job was killed (exit 143).
      # So the build compiles and sizes what is deployed (src/ and script/; with test/ in it `--sizes` would also hold
      # the test-only StockVaultV2Mock, StockVault plus a slot and a function, to the 24,576-byte limit), and the tests
      # run in three parts: `forge test --match-path` compiles src/ and the matching tests only, in its own solc process
      # (at most 5.7, 8.6 and 4.5 GiB). `*` matches across directories here; the three together run every test that
      # `forge test` runs.
      - run: forge build --sizes --skip test
      - run: forge test -vvv --match-path 'test/StockVault*'
      - run: forge test -vvv --match-path 'test/*Seat*'
      - run: forge test -vvv --no-match-path 'test/{StockVault*,*Seat*}'

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      # `npm test` needs foundry, not just Node: selfcheck.mjs runs `forge test` to prove the
      # lender-loss regression is really in the suite, and spawns `anvil` to drive a fresh agent
      # through a real loan. Without this it fails on `spawn anvil ENOENT`.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # Pinned to the version the maintainers actually run. It was v1.3.0, whose `forge fmt` disagrees
          # with newer releases about blank lines, so `fmt --check` failed in CI on files that were clean
          # locally. A formatter check is only useful if both sides format the same way.
          version: v1.7.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Every entry point a user actually runs, so a syntax error cannot ship green.
      - run: for f in bin/priors.mjs bin/priors-v2.mjs sdk/env.mjs sdk/priors.mjs sdk/priors-v2.mjs sdk/float.mjs sdk/x402.mjs; do node --check "$f"; done

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # --history walks every blob in every commit, which needs the full history, not a shallow clone.
          fetch-depth: 0
      - run: bash scripts/check-public.sh --history
