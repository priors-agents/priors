# The README says `forge test` is 404 passed and that scripts/check-public.sh is "what CI runs".
# Until now there was no CI, so both were claims a reader had to take on trust. This is the CI.
#
# check-public.sh is the load-bearing one: this repo is public, and the check that nothing
# credential-shaped is tracked belongs on every push rather than on somebody remembering.
name: ci
on:
  push:
  pull_request:
# Nothing here writes back to the repo or uses the token, so it gets read and no more.
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the version the maintainers actually run. It was v1.3.0, whose `forge fmt` disagrees
          # with newer releases about blank lines, so `fmt --check` failed in CI on files that were clean
          # locally. A formatter check is only useful if both sides format the same way.
          version: v1.7.1
      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # `npm test` needs foundry, not just Node: selfcheck.mjs runs `forge test` to prove the
      # lender-loss regression is really in the suite, and spawns `anvil` to drive a fresh agent
      # through a real loan. Without this it fails on `spawn anvil ENOENT`.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the version the maintainers actually run. It was v1.3.0, whose `forge fmt` disagrees
          # with newer releases about blank lines, so `fmt --check` failed in CI on files that were clean
          # locally. A formatter check is only useful if both sides format the same way.
          version: v1.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Every entry point a user actually runs, so a syntax error cannot ship green.
      - run: for f in bin/priors.mjs bin/priors-v2.mjs sdk/env.mjs sdk/priors.mjs sdk/priors-v2.mjs sdk/float.mjs sdk/x402.mjs; do node --check "$f"; done

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --history walks every blob in every commit, which needs the full history, not a shallow clone.
          fetch-depth: 0
      - run: bash scripts/check-public.sh --history
