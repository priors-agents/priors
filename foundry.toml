[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# CreditPoolV2 needs via-IR with minimal runs to fit the 24 KB code limit; everything else compiles as before.
additional_compiler_profiles = [{ name = "pool-v2", via_ir = true, optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "src/CreditPoolV2.sol", via_ir = true, optimizer_runs = 1 }]
# TreasurySponsorV5 and InviteBondV2 import CreditPoolV2's source, so their tests join its via-IR job and need a lot of
# memory: they run on their own, FOUNDRY_PROFILE=v5 forge test --match-path 'test/{InviteBondV2,TreasurySponsorV5}*.t.sol'
# test/income runs in its own scratch project (bash test/income/forge.sh test), as in the private repository: it
# deploys CreditPoolV2 from its build artifact, so the pool's source is never compiled with it.
skip = ["test/TreasurySponsorV5*.t.sol", "test/InviteBondV2.t.sol", "test/income/**"]

# TreasurySponsorV5 and InviteBondV2 with the rest of the suite
[profile.v5]
skip = []

[fmt]
line_length = 120
tab_width = 4
# StockVault.sol and AutoRepayV2.sol stay byte-identical to the sources verified on chain (formatting either would
# change that source).
ignore = ["src/StockVault.sol", "src/AutoRepayV2.sol"]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood = { key = "none", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable", "screaming-snake-case-immutable", "screaming-snake-case-const", "divide-before-multiply"]

[invariant]
runs = 256
# 400, not 64. `invariant_exposureWithinCapacity` was broken and the committed depth of 64 never found it:
# it took 73 runs at depth 400 to surface. A bound the suite cannot reach is not a bound. ~21s a run.
depth = 400
fail_on_revert = false
